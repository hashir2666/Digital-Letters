
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
#w { width: 100%; height: 100vh; position: relative; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
<div id="w"><canvas id="c"></canvas></div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, symbols = [];

function resize() {
  W = canvas.width = canvas.offsetWidth;
  H = canvas.height = canvas.offsetHeight;
}
resize();
window.addEventListener('resize', resize);

function drawBg() {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0,   '#fff0f5');
  g.addColorStop(0.3, '#fce4ec');
  g.addColorStop(0.6, '#ffd6e7');
  g.addColorStop(1,   '#fff8fb');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  [
    { x: W*0.12, y: H*0.2,  r: W*0.38, c: 'rgba(255,182,193,0.35)' },
    { x: W*0.85, y: H*0.7,  r: W*0.32, c: 'rgba(255,105,135,0.2)'  },
    { x: W*0.5,  y: H*0.5,  r: W*0.42, c: 'rgba(255,228,240,0.38)' },
    { x: W*0.78, y: H*0.12, r: W*0.28, c: 'rgba(255,192,203,0.3)'  },
    { x: W*0.3,  y: H*0.8,  r: W*0.25, c: 'rgba(255,160,180,0.22)' },
  ].forEach(gw => {
    const rg = ctx.createRadialGradient(gw.x, gw.y, 0, gw.x, gw.y, gw.r);
    rg.addColorStop(0, gw.c);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
  });
}

function drawStar(x, y, r, alpha) {
  const bl = ctx.createRadialGradient(x, y, 0, x, y, r*3.2);
  bl.addColorStop(0, `rgba(255,200,220,${alpha*0.55})`);
  bl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bl; ctx.beginPath(); ctx.arc(x, y, r*3.2, 0, Math.PI*2); ctx.fill();
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i%2===0 ? r : r*0.42;
    const a = (i*Math.PI/5) - Math.PI/2;
    i===0 ? ctx.moveTo(rad*Math.cos(a), rad*Math.sin(a)) : ctx.lineTo(rad*Math.cos(a), rad*Math.sin(a));
  }
  ctx.closePath();
  const sg = ctx.createRadialGradient(0, -r*0.2, 0, 0, 0, r);
  sg.addColorStop(0, `rgba(255,255,255,${alpha})`);
  sg.addColorStop(0.5, `rgba(255,182,193,${alpha})`);
  sg.addColorStop(1, `rgba(233,30,140,${alpha*0.7})`);
  ctx.fillStyle = sg;
  ctx.shadowBlur = 22; ctx.shadowColor = `rgba(255,105,135,${alpha*0.9})`;
  ctx.fill();
  ctx.strokeStyle = `rgba(255,255,255,${alpha*0.75})`; ctx.lineWidth = 0.8;
  for (let i = 0; i < 4; i++) {
    const a = (i/4)*Math.PI;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r*0.12, Math.sin(a)*r*0.12);
    ctx.lineTo(Math.cos(a)*r*2.1, Math.sin(a)*r*2.1);
    ctx.stroke();
  }
  ctx.restore();
}

function drawHeart(x, y, r, alpha) {
  const bl = ctx.createRadialGradient(x, y, 0, x, y, r*3);
  bl.addColorStop(0, `rgba(255,150,180,${alpha*0.4})`);
  bl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bl; ctx.beginPath(); ctx.arc(x, y, r*3, 0, Math.PI*2); ctx.fill();
  ctx.save(); ctx.translate(x, y);
  const s = r;
  ctx.beginPath();
  ctx.moveTo(0, s*0.35);
  ctx.bezierCurveTo(-s*0.05, s*0.15, -s*0.5, -s*0.05, -s*0.5, -s*0.28);
  ctx.bezierCurveTo(-s*0.5, -s*0.62, 0, -s*0.58, 0, -s*0.22);
  ctx.bezierCurveTo(0, -s*0.58, s*0.5, -s*0.62, s*0.5, -s*0.28);
  ctx.bezierCurveTo(s*0.5, -s*0.05, s*0.05, s*0.15, 0, s*0.35);
  ctx.closePath();
  const hg = ctx.createRadialGradient(-s*0.18, -s*0.3, 0, 0, 0, s*0.58);
  hg.addColorStop(0, `rgba(255,255,255,${alpha})`);
  hg.addColorStop(0.3, `rgba(255,182,193,${alpha})`);
  hg.addColorStop(0.7, `rgba(240,98,146,${alpha*0.9})`);
  hg.addColorStop(1,   `rgba(194,24,91,${alpha*0.7})`);
  ctx.fillStyle = hg;
  ctx.shadowBlur = 24; ctx.shadowColor = `rgba(255,105,135,${alpha*0.9})`;
  ctx.fill(); ctx.restore();
}

function drawRose(x, y, r, alpha) {
  const bl = ctx.createRadialGradient(x, y, 0, x, y, r*3);
  bl.addColorStop(0, `rgba(255,130,160,${alpha*0.38})`);
  bl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bl; ctx.beginPath(); ctx.arc(x, y, r*3, 0, Math.PI*2); ctx.fill();
  ctx.save(); ctx.translate(x, y);
  for (let i = 0; i < 5; i++) {
    const a = (i/5)*Math.PI*2;
    ctx.save(); ctx.rotate(a);
    ctx.beginPath(); ctx.ellipse(0, -r*0.52, r*0.32, r*0.46, 0, 0, Math.PI*2);
    const pg = ctx.createRadialGradient(0, -r*0.36, 0, 0, -r*0.52, r*0.48);
    pg.addColorStop(0, `rgba(255,255,255,${alpha*0.95})`);
    pg.addColorStop(0.4, `rgba(255,182,193,${alpha})`);
    pg.addColorStop(1, `rgba(233,30,140,${alpha*0.75})`);
    ctx.fillStyle = pg; ctx.shadowBlur = 14; ctx.shadowColor = `rgba(255,105,135,${alpha*0.6})`;
    ctx.fill(); ctx.restore();
  }
  for (let i = 0; i < 5; i++) {
    const a = (i/5)*Math.PI*2 + 0.32;
    ctx.save(); ctx.rotate(a);
    ctx.beginPath(); ctx.ellipse(0, -r*0.3, r*0.24, r*0.34, 0, 0, Math.PI*2);
    const pg2 = ctx.createRadialGradient(0, -r*0.2, 0, 0, -r*0.3, r*0.34);
    pg2.addColorStop(0, `rgba(255,255,255,${alpha})`);
    pg2.addColorStop(0.5, `rgba(255,182,193,${alpha})`);
    pg2.addColorStop(1, `rgba(233,30,140,${alpha*0.8})`);
    ctx.fillStyle = pg2; ctx.fill(); ctx.restore();
  }
  const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, r*0.22);
  cg.addColorStop(0, `rgba(255,255,255,${alpha})`);
  cg.addColorStop(1, `rgba(255,182,193,${alpha})`);
  ctx.fillStyle = cg; ctx.shadowBlur = 20; ctx.shadowColor = `rgba(255,105,135,${alpha})`;
  ctx.beginPath(); ctx.arc(0, 0, r*0.22, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawSparkle(x, y, r, alpha) {
  const sg = ctx.createRadialGradient(x, y, 0, x, y, r*2.8);
  sg.addColorStop(0, `rgba(255,255,255,${alpha})`);
  sg.addColorStop(0.4, `rgba(255,182,193,${alpha*0.8})`);
  sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(x, y, r*2.8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = `rgba(255,255,255,${alpha})`;
  ctx.beginPath(); ctx.arc(x, y, r*0.55, 0, Math.PI*2); ctx.fill();
}

const TYPES = ['star','heart','rose','rose','sparkle','sparkle'];

function mkSymbol() {
  const type = TYPES[Math.floor(Math.random()*TYPES.length)];
  return {
    type,
    x: Math.random()*W,
    y: Math.random()*H,
    r: type==='sparkle' ? 2+Math.random()*5 : 9+Math.random()*22,
    speed: (Math.random()-0.5)*0.2,
    drift: (Math.random()-0.5)*0.16,
    alpha: Math.random()*0.5,
    targetAlpha: 0.45+Math.random()*0.55,
    wobble: Math.random()*Math.PI*2,
    ws: 0.007+Math.random()*0.013,
    tw: Math.random()*Math.PI*2,
    ts: 0.016+Math.random()*0.024,
  };
}

for (let i = 0; i < 65; i++) symbols.push(mkSymbol());

function loop() {
  ctx.clearRect(0, 0, W, H);
  drawBg();
  symbols.forEach(p => {
    p.y += p.speed; p.x += p.drift;
    p.wobble += p.ws; p.tw += p.ts;
    if (p.y > H+55) p.y = -55;
    if (p.y < -55) p.y = H+55;
    if (p.x > W+55) p.x = -55;
    if (p.x < -55) p.x = W+55;
    if (p.alpha < p.targetAlpha) p.alpha = Math.min(p.alpha+0.005, p.targetAlpha);
    const a = p.alpha * (0.8 + Math.sin(p.tw)*0.2);
    if      (p.type==='star')    drawStar(p.x, p.y, p.r, a);
    else if (p.type==='heart')   drawHeart(p.x, p.y, p.r, a);
    else if (p.type==='rose')    drawRose(p.x, p.y, p.r, a);
    else                         drawSparkle(p.x, p.y, p.r, a);
  });
  requestAnimationFrame(loop);
}
loop();
</script>
